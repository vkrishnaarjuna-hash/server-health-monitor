# sonar-project.properties
# Configuration for SonarCloud code quality and security scanning.

# Project identification:
# These placeholders are deliberately left unpopulated or commented out.
# In CI/CD pipelines, they are injected at runtime via GitHub Actions repository variables:
#   -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
#   -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
# For local scanner execution, uncomment and replace with your SonarCloud project details:
# sonar.projectKey=YOUR_ORGANIZATION_KEY_server-health-monitor
# sonar.organization=YOUR_ORGANIZATION_KEY

# Source code and test suite locations
sonar.sources=src
sonar.tests=tests

# Target runtime environment
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Code coverage report path (generated by pytest-cov with relative_files=true)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions justification:
# - org/**: Contains sample mock log files used for demonstration and manual validation.
#   These are not executable source code and should not be analyzed as Python code.
# - scripts/**: Contains the standalone Docker smoke test harness, which is a build-time
#   verification tool rather than part of the distributed health_monitor package.
sonar.exclusions=org/**,scripts/**
