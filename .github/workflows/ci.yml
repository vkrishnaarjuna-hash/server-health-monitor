name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: 1. Setup & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

  test:
    name: 2. Unit Tests & Coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage gate (>= 80%)
        run: |
          pytest --cov=health_monitor \
                 --cov-report=xml \
                 --cov-report=term-missing \
                 --cov-fail-under=80

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 1

  sonar:
    name: 3. SonarCloud Quality Gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full git history for blame analysis)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Check SonarCloud credentials availability
        id: check-sonar
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ] || [ -z "${{ vars.SONAR_PROJECT_KEY }}" ] || [ -z "${{ vars.SONAR_ORGANIZATION }}" ]; then
            echo "::notice ::SonarCloud secrets or repository variables (SONAR_TOKEN, SONAR_PROJECT_KEY, SONAR_ORGANIZATION) not configured. Skipping scan."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run SonarCloud Scan & Enforce Quality Gate
        if: steps.check-sonar.outputs.enabled == 'true'
        uses: sonarsource/sonarcloud-github-action@v3
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: 4. Build Container Image
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --tag "server-health-monitor:${{ github.sha }}" \
            --build-arg VCS_REF="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            .

      - name: Save Docker image archive
        run: docker save "server-health-monitor:${{ github.sha }}" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  smoke:
    name: 5. Container Smoke Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image into daemon
        run: docker load -i image.tar

      - name: Run end-to-end smoke tests
        run: python scripts/smoke_test.py "server-health-monitor:${{ github.sha }}"

  scan:
    name: 6. Container Vulnerability Scan
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image into daemon
        run: docker load -i image.tar

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: "server-health-monitor:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  publish:
    name: 7. Publish to GHCR
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image into daemon
        run: docker load -i image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable SHA tag and publish
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}"
          SHA_TAG="${IMAGE_NAME}:${{ github.sha }}"
          MAIN_TAG="${IMAGE_NAME}:main"
          LATEST_TAG="${IMAGE_NAME}:latest"
          LOCAL_IMAGE="server-health-monitor:${{ github.sha }}"

          echo "Checking if immutable tag ${SHA_TAG} already exists on GHCR..."
          if docker manifest inspect "${SHA_TAG}" > /dev/null 2>&1; then
            echo "::error ::Immutable tag ${SHA_TAG} already exists on GHCR! Overwriting existing releases is forbidden."
            exit 1
          fi

          echo "Tagging ${LOCAL_IMAGE} -> ${SHA_TAG}, ${MAIN_TAG}, ${LATEST_TAG}"
          docker tag "${LOCAL_IMAGE}" "${SHA_TAG}"
          docker tag "${LOCAL_IMAGE}" "${MAIN_TAG}"
          docker tag "${LOCAL_IMAGE}" "${LATEST_TAG}"

          echo "Publishing container images to GHCR..."
          docker push "${SHA_TAG}"
          docker push "${MAIN_TAG}"
          docker push "${LATEST_TAG}"
